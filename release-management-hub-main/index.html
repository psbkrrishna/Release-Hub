<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Hub — Zwayam</title>
    <meta name="description" content="Zwayam Product Hub — releases, feature enablement, and product documentation in one place." />

    <meta property="og:title" content="Product Hub — Zwayam" />
    <meta property="og:description" content="Zwayam Product Hub — releases, feature enablement, and product documentation in one place." />
    <meta property="og:type" content="website" />

    <!-- Source Sans 3 was previously embedded as a base64 woff2 inside
         src/styles/zerra.css. That stylesheet is gone, so the typeface is
         loaded here instead. This is the one thing the refactor traded away:
         the app now needs the network on first load to render in-brand
         (it falls back to system-ui otherwise). Self-host under public/ if
         offline rendering matters. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />

    <!-- The only document-level CSS the guidelines permit: body resets, the
         link and focus defaults, scrollbars, and the standard keyframes.
         Everything else is an inline style, and the design tokens these rules
         reference live on the app's root wrapper (src/styles/zerra.ts). -->
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; -webkit-font-smoothing: antialiased; }
      a { color: var(--brand); text-decoration: none; }
      a:hover { color: var(--brand-solidHover); }
      :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
      ::placeholder { color: var(--tx4); opacity: 1; }
      ::selection { background: var(--brand-soft); color: var(--brand); }

      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: #DADADC; border-radius: 999px; }
      ::-webkit-scrollbar-track { background: transparent; }

      @keyframes zdot { 0%,60%,100% { transform: translateY(0) scale(1,1); opacity: .55; } 15% { transform: translateY(1px) scale(1.25,.75); opacity: .8; } 35% { transform: translateY(-6px) scale(.85,1.15); opacity: 1; } 50% { transform: translateY(0) scale(1.15,.85); opacity: .8; } }
      @keyframes zshimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
      @keyframes zspin { to { transform: rotate(360deg); } }
      @keyframes riseIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes slideInRight { from { transform: translateX(100%); } to { transform: none; } }
      @keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes shakeX {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-4px); }
        75% { transform: translateX(4px); }
      }

      /* Home C hero search: a gradient stroke draws round the field, then a
         soft ring radiates from it. Lt is the variant tuned for the navy hero. */
      @keyframes rhFill {
        0% { stroke-dasharray: 0 100; opacity: 1; animation-timing-function: cubic-bezier(0.65,0,0.35,1); }
        40% { stroke-dasharray: 100 0; opacity: 1; }
        58% { stroke-dasharray: 100 0; opacity: 1; }
        68% { stroke-dasharray: 100 0; opacity: 0; }
        100% { stroke-dasharray: 100 0; opacity: 0; }
      }
      @keyframes rhRadiateLt {
        0%, 39% { box-shadow: 0 0 0 0 rgba(167,150,255,0); }
        41% { box-shadow: 0 0 0 0 rgba(167,150,255,0.75); }
        68%, 100% { box-shadow: 0 0 0 16px rgba(167,150,255,0); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: .01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: .01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
